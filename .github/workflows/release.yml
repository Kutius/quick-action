# Pushing a tag such as v0.1.1 builds the app, signs its update, and
# uploads them to a draft release of the tag, which is published by hand:
# installed apps update to it then.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the version matches the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            throw "mygo.json says $version, but the tag is $env:TAG"
          }

      - name: Test
        run: go test ./...

      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow, and puts the version's section of
      # CHANGELOG.md in the update manifest and the release notes.
      - name: Build, sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload

      # The installer and the update archive are what mygo build uploads;
      # the zip is the portable copy the README offers.
      - name: Upload the portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $zip = "build/quick-action-$version-amd64.zip"
          Compress-Archive -Path build/windows-amd64/quick-action.exe, build/windows-amd64/icon.png -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
